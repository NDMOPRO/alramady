<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  RASID Platform - Fixed Rendering Environment Font Configuration
  Ensures deterministic font rendering across all containers.
  ALL variability sources are eliminated.
-->
<fontconfig>
  <!-- Disable anti-aliasing for pixel-perfect comparison -->
  <match target="font">
    <edit name="antialias" mode="assign">
      <bool>false</bool>
    </edit>
  </match>

  <!-- Full hinting for crisp text -->
  <match target="font">
    <edit name="hinting" mode="assign">
      <bool>true</bool>
    </edit>
    <edit name="hintstyle" mode="assign">
      <const>hintfull</const>
    </edit>
    <edit name="autohint" mode="assign">
      <bool>false</bool>
    </edit>
  </match>

  <!-- Disable subpixel rendering -->
  <match target="font">
    <edit name="rgba" mode="assign">
      <const>none</const>
    </edit>
    <edit name="lcdfilter" mode="assign">
      <const>lcdnone</const>
    </edit>
  </match>

  <!-- Disable embedded bitmaps (source of variability) -->
  <match target="font">
    <edit name="embeddedbitmap" mode="assign">
      <bool>false</bool>
    </edit>
  </match>

  <!-- Reject fallback fonts during validation — use only exact matches -->
  <selectfont>
    <rejectfont>
      <pattern>
        <patelt name="family">
          <string>Noto Color Emoji</string>
        </patelt>
      </pattern>
    </rejectfont>
  </selectfont>

  <!-- Arabic font priority (strict chain) -->
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Cairo</family>
      <family>Tajawal</family>
      <family>Noto Sans Arabic</family>
      <family>IBM Plex Sans Arabic</family>
      <family>Almarai</family>
      <family>Inter</family>
      <family>Roboto</family>
      <family>Noto Sans</family>
      <family>Liberation Sans</family>
    </prefer>
  </alias>

  <alias>
    <family>serif</family>
    <prefer>
      <family>Amiri</family>
      <family>Noto Naskh Arabic</family>
      <family>Noto Serif</family>
      <family>Liberation Serif</family>
    </prefer>
  </alias>

  <alias>
    <family>monospace</family>
    <prefer>
      <family>Noto Sans Mono</family>
      <family>Liberation Mono</family>
      <family>DejaVu Sans Mono</family>
    </prefer>
  </alias>

  <!-- Fixed DPI — must match RENDER_CONFIG.dpi -->
  <match target="pattern">
    <edit name="dpi" mode="assign">
      <double>150</double>
    </edit>
  </match>
</fontconfig>
