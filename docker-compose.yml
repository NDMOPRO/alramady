    restart: unless-stopped
    ports:
      - "8012:8012"
    environment:
      PORT: 8012
      SERVICE_NAME: template-service
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      JWT_SECRET: ${JWT_SECRET}
      NODE_ENV: ${NODE_ENV}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8012/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 3
    networks:
      - rasid-network

  conversion-service:
