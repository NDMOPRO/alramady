      context: ./services/conversion-service
      dockerfile: Dockerfile
    container_name: rasid-conversion-service
    restart: unless-stopped
    ports:
      - "8013:8013"
    environment:
      PORT: 8013
      SERVICE_NAME: conversion-service
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_PORT: ${MINIO_PORT}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET}
      JWT_SECRET: ${JWT_SECRET}
      NODE_ENV: ${NODE_ENV}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8013/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 3
    networks:
      - rasid-network

  # ═══════════════════════════════════════════════
  # RENDERING ENVIRONMENT (Pixel-Perfect Validation)
  # ═══════════════════════════════════════════════

  rendering-environment:
    build:
      context: ./services/rendering-environment
      dockerfile: Dockerfile
    container_name: rasid-rendering-environment
    restart: unless-stopped
    ports:
      - "8014:8014"
    environment:
      PORT: 8014
      SERVICE_NAME: rendering-environment
      DPI: "150"
      FONT_HINTING: "full"
      SUBPIXEL_RENDERING: "false"
      ANTIALIASING: "false"
      COLOR_SPACE: "srgb"
      CHROMIUM_PATH: "/usr/bin/chromium"
      NODE_ENV: ${NODE_ENV}
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "2.0"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8014/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 3
    networks:
      - rasid-network

  # ═══════════════════════════════════════════════
  # FRONTEND
  # ═══════════════════════════════════════════════

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: rasid-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost
      INTERNAL_API_URL: http://gateway:80
      NODE_ENV: ${NODE_ENV}
    depends_on:
      governance-service:
        condition: service_healthy
    networks:
      - rasid-network

volumes:
  postgres_data:
  redis_data:
  elasticsearch_data:
  minio_data:

networks:
  rasid-network:
    driver: bridge
