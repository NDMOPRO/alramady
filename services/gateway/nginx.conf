worker_processes auto;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    resolver 127.0.0.11 ipv6=off valid=30s;
    sendfile      on;
    tcp_nopush    on;
    tcp_nodelay   on;
    keepalive_timeout 65;

    # Client body size for large file uploads
    client_max_body_size 500M;
    client_body_buffer_size 10M;

    # Proxy timeouts
    proxy_connect_timeout 60s;
    proxy_read_timeout    300s;
    proxy_send_timeout    300s;
    proxy_buffer_size     128k;
    proxy_buffers         4 256k;
    proxy_busy_buffers_size 256k;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time urt=$upstream_response_time';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1000;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        application/x-javascript
        image/svg+xml;

    # Rate limiting zone
    limit_req_zone $binary_remote_addr zone=api:10m rate=100r/s;

    # Map for WebSocket connection upgrade
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # =========================================================================
    # Upstream blocks: 13 services + frontend
    # =========================================================================
    upstream frontend {
        server frontend:3000;
    }

    upstream data_service {
        server data-service:8001;
    }

    upstream excel_service {
        server excel-service:8002;
    }

    upstream dashboard_service {
        server dashboard-service:8003;
    }

    upstream reporting_service {
        server reporting-service:8004;
    }

    upstream presentation_service {
        server presentation-service:8005;
    }

    upstream infographic_service {
        server infographic-service:8006;
    }

    upstream replication_service {
        server replication-service:8007;
    }

    upstream localization_service {
        server localization-service:8008;
    }

    upstream ai_service {
        server ai-service:8009;
    }

    upstream governance_service {
        server governance-service:8010;
    }

    upstream library_service {
        server library-service:8011;
    }

    upstream template_service {
        server template-service:8012;
    }

    upstream conversion_service {
        server conversion-service:8013;
    }

    upstream rendering_service {
        server rendering-environment:8014;
    }

    # =========================================================================
    # Server block
    # =========================================================================
    server {
        listen 80;
        server_name _;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Gateway health endpoint
        location /health {
            access_log off;
            return 200 '{"status":"ok","service":"gateway","timestamp":"$time_iso8601"}';
            add_header Content-Type application/json;
        }

        # -----------------------------------------------------------------
        # Service 1: Data Engine (port 8001)
        # -----------------------------------------------------------------
        location /api/v1/data/ {
            limit_req zone=api burst=50 nodelay;
            set $data_service_upstream http://data-service:8001;
            proxy_pass $data_service_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_connect_timeout 30s;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }

        # -----------------------------------------------------------------
        # Service 2: Excel Engine (port 8002)
        # -----------------------------------------------------------------
        location /api/v1/excel/ {
            limit_req zone=api burst=50 nodelay;
            proxy_pass http://excel_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_connect_timeout 30s;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }

        # -----------------------------------------------------------------
        # Service 3: Dashboard Engine (port 8003)
        # -----------------------------------------------------------------
        location /api/v1/dashboard/ {
            limit_req zone=api burst=50 nodelay;
            proxy_pass http://dashboard_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_connect_timeout 30s;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }

        # -----------------------------------------------------------------
        # Service 4: Reporting Engine (port 8004)
        # -----------------------------------------------------------------
        location /api/v1/reporting/ {
            limit_req zone=api burst=50 nodelay;
            proxy_pass http://reporting_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_connect_timeout 30s;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # -----------------------------------------------------------------
        # Service 5: Presentation Engine (port 8005)
        # -----------------------------------------------------------------
        location /api/v1/presentation/ {
            limit_req zone=api burst=50 nodelay;
            set $presentation_service_upstream http://presentation-service:8005;
            proxy_pass $presentation_service_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_connect_timeout 30s;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }

        # -----------------------------------------------------------------
        # Service 6: Infographic Engine (port 8006)
        # -----------------------------------------------------------------
        location /api/v1/infographic/ {
            limit_req zone=api burst=50 nodelay;
            proxy_pass http://infographic_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_connect_timeout 30s;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }

        # -----------------------------------------------------------------
        # Service 7: Replication Engine (port 8007)
        # -----------------------------------------------------------------
        location /api/v1/replication/ {
            limit_req zone=api burst=50 nodelay;
            proxy_pass http://replication_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_connect_timeout 30s;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }

        # -----------------------------------------------------------------
        # Service 8: Localization Engine (port 8008)
        # -----------------------------------------------------------------
        location /api/v1/localization/ {
            limit_req zone=api burst=50 nodelay;
            proxy_pass http://localization_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_connect_timeout 30s;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }

        # -----------------------------------------------------------------
        # Service 9: AI Engine (port 8009)
        # -----------------------------------------------------------------
        location /api/v1/ai/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://ai_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_connect_timeout 30s;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
            proxy_buffering off;
            proxy_cache off;
        }

        # -----------------------------------------------------------------
        # Service 10: Governance Engine (port 8010)
        # -----------------------------------------------------------------
        location /api/v1/governance/ {
            limit_req zone=api burst=50 nodelay;
            set $governance_service_upstream http://governance-service:8010;
            proxy_pass $governance_service_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_connect_timeout 30s;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }

        # -----------------------------------------------------------------
        # Service 11: Library Engine (port 8011)
        # -----------------------------------------------------------------
        location /api/v1/library/ {
            limit_req zone=api burst=50 nodelay;
            set $library_service_upstream http://library-service:8011;
            proxy_pass $library_service_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_connect_timeout 30s;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }

        # -----------------------------------------------------------------
        # Service 12: Template Engine (port 8012)
        # -----------------------------------------------------------------
        location /api/v1/template/ {
            limit_req zone=api burst=50 nodelay;
            proxy_pass http://template_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_connect_timeout 30s;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }

        # -----------------------------------------------------------------
        # Service 13: Conversion Engine (port 8013)
        # -----------------------------------------------------------------
        location /api/v1/conversion/ {
            limit_req zone=api burst=50 nodelay;
            proxy_pass http://conversion_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_connect_timeout 30s;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # -----------------------------------------------------------------
        # Service 14: Rendering Environment (port 8014)
        # -----------------------------------------------------------------
        location /api/v1/render/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://rendering_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_connect_timeout 30s;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }

        # -----------------------------------------------------------------
        # Smart Observer (AI service - /observer prefix)
        # -----------------------------------------------------------------
        location /observer/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://ai_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_connect_timeout 30s;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
            proxy_buffering off;
            proxy_cache off;
        }

        # -----------------------------------------------------------------
        # Cross-Engine Data Bridge (routed through AI service)
        # -----------------------------------------------------------------
        location /api/bridge/ {
            limit_req zone=api burst=100 nodelay;
            proxy_pass http://ai_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_connect_timeout 30s;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }

        # -----------------------------------------------------------------
        # AI Training Center (routed through AI service)
        # -----------------------------------------------------------------
        location /api/training/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://ai_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_connect_timeout 30s;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
        }

        # -----------------------------------------------------------------
        # Autonomous Intelligence Layer (routed through AI service)
        # -----------------------------------------------------------------
        location /api/intelligence/ {
            limit_req zone=api burst=30 nodelay;
            proxy_pass http://ai_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_connect_timeout 30s;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
            proxy_buffering off;
            proxy_cache off;
        }

        # -----------------------------------------------------------------
        # Frontend (Next.js on port 3000) - catch-all with WebSocket
        # -----------------------------------------------------------------
        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # WebSocket support for HMR in development
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
    }
}
