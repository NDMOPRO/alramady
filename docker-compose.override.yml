##
## Rasid Platform - Development Overrides
##
## This file is automatically loaded by docker-compose alongside docker-compose.yml.
## It adds volume mounts for hot-reload, debug ports, and dev-friendly settings.
##
## Usage:
##   docker-compose up           # Loads both docker-compose.yml + override
##   docker-compose up --build   # Rebuild with dev settings
##

version: "3.9"

services:
  # ---- Infrastructure ----

  postgres:
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: rasid
      POSTGRES_PASSWORD: rasid_secret_2024
      POSTGRES_DB: rasid_db

  redis:
    ports:
      - "6379:6379"
    command: redis-server --loglevel verbose

  elasticsearch:
    environment:
      - "ES_JAVA_OPTS=-Xms256m -Xmx256m"

  minio:
    ports:
      - "9000:9000"
      - "9001:9001"

  # ---- Gateway ----

  gateway:
    ports:
      - "80:80"
    volumes:
      - ./services/gateway/nginx.conf:/etc/nginx/nginx.conf:ro

  # ---- Frontend ----

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/app:/app/app
      - ./frontend/components:/app/components
      - ./frontend/lib:/app/lib
      - ./frontend/public:/app/public
      - ./frontend/package.json:/app/package.json
      - ./frontend/tailwind.config.ts:/app/tailwind.config.ts
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://localhost
      - INTERNAL_API_URL=http://gateway:80
      - WATCHPACK_POLLING=true
    ports:
      - "3000:3000"

  # ---- Service 1: Data Engine ----

  data-service:
    build:
      context: ./services/data-service
      target: dev
    volumes:
      - ./services/data-service/src:/app/src
      - ./packages/shared:/app/packages/shared
    environment:
      - NODE_ENV=development
      - LOG_LEVEL=debug
    ports:
      - "8001:8001"
      - "9221:9229"
    command: npx tsx watch --inspect=0.0.0.0:9229 src/index.ts

  # ---- Service 2: Excel Engine ----

  excel-service:
    build:
      context: ./services/excel-service
      target: dev
    volumes:
      - ./services/excel-service/src:/app/src
      - ./packages/shared:/app/packages/shared
    environment:
      - NODE_ENV=development
      - LOG_LEVEL=debug
    ports:
      - "8002:8002"
      - "9222:9229"
    command: npx tsx watch --inspect=0.0.0.0:9229 src/index.ts

  # ---- Service 3: Dashboard Engine ----

  dashboard-service:
