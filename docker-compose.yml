version: '3.9'

services:
  # ═══════════════════════════════════════════════
  # INFRASTRUCTURE SERVICES
  # ═══════════════════════════════════════════════

  postgres:
    image: postgres:16-alpine
    container_name: rasid-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rasid-network

  redis:
    image: redis:7-alpine
    container_name: rasid-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rasid-network

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
    container_name: rasid-elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.enrollment.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - cluster.name=rasid-cluster
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - rasid-network

  minio:
    image: minio/minio:latest
    container_name: rasid-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - rasid-network

  # ═══════════════════════════════════════════════
  # GATEWAY
  # ═══════════════════════════════════════════════

  gateway:
    image: nginx:1.25-alpine
    container_name: rasid-gateway
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./services/gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      data-service:
        condition: service_healthy
      excel-service:
        condition: service_healthy
      dashboard-service:
        condition: service_healthy
      reporting-service:
        condition: service_healthy
      presentation-service:
        condition: service_healthy
      infographic-service:
        condition: service_healthy
      replication-service:
        condition: service_healthy
      localization-service:
        condition: service_healthy
      ai-service:
        condition: service_healthy
      governance-service:
        condition: service_healthy
      library-service:
        condition: service_healthy
      template-service:
        condition: service_healthy
      conversion-service:
        condition: service_healthy
      frontend:
        condition: service_started
    networks:
      - rasid-network

  # ═══════════════════════════════════════════════
  # MICROSERVICES
  # ═══════════════════════════════════════════════

  data-service:
    build:
      context: ./services/data-service
      dockerfile: Dockerfile
    container_name: rasid-data-service
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      PORT: 8001
      SERVICE_NAME: data-service
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      ELASTICSEARCH_URL: ${ELASTICSEARCH_URL}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_PORT: ${MINIO_PORT}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET}
      JWT_SECRET: ${JWT_SECRET}
      NODE_ENV: ${NODE_ENV}
      RATE_LIMIT_MAX: 5000
      RATE_LIMIT_WINDOW: 60000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8001/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 3
    networks:
      - rasid-network

  excel-service:
