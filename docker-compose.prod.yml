##
## Rasid Platform - Production Scaling Configuration
##
## Usage:
##   docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d
##
## Designed for 50,000+ concurrent users with horizontal scaling
##

version: "3.9"

services:
  # ── Infrastructure Scaling ──────────────────────────────

  postgres:
    environment:
      POSTGRES_MAX_CONNECTIONS: "500"
      POSTGRES_SHARED_BUFFERS: "2GB"
      POSTGRES_EFFECTIVE_CACHE_SIZE: "6GB"
      POSTGRES_WORK_MEM: "256MB"
    deploy:
      resources:
        limits:
          memory: 8G
          cpus: "4.0"
        reservations:
          memory: 4G
          cpus: "2.0"

  redis:
    command: redis-server --appendonly yes --maxmemory 2gb --maxmemory-policy allkeys-lru --save 900 1 --save 300 10
    deploy:
      resources:
        limits:
          memory: 3G
          cpus: "2.0"
        reservations:
          memory: 1G

  elasticsearch:
    environment:
      - "ES_JAVA_OPTS=-Xms2g -Xmx2g"
      - cluster.name=rasid-prod
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "2.0"

  # ── Gateway (Load Balancer) ─────────────────────────────

  gateway:
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 512M
          cpus: "1.0"

  # ── Core Services with Horizontal Scaling ───────────────

  data-service:
    deploy:
      replicas: 4
      resources:
        limits:
          memory: 2G
          cpus: "2.0"
        reservations:
          memory: 512M
          cpus: "0.5"
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
    environment:
      NODE_ENV: production
      LOG_LEVEL: warn
      NODE_OPTIONS: "--max-old-space-size=1536"

  excel-service:
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 2G
          cpus: "2.0"
    environment:
      NODE_ENV: production
      NODE_OPTIONS: "--max-old-space-size=1536"

  dashboard-service:
    deploy:
      replicas: 3
      resources:
        limits:
          memory: 1G
          cpus: "1.0"
    environment:
      NODE_ENV: production

  reporting-service:
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 2G
          cpus: "2.0"
    environment:
      NODE_ENV: production

  presentation-service:
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 2G
          cpus: "2.0"
    environment:
      NODE_ENV: production

  ai-service:
    deploy:
      replicas: 3
      resources:
        limits:
          memory: 4G
          cpus: "4.0"
        reservations:
          memory: 1G
          cpus: "1.0"
    environment:
      NODE_ENV: production
      NODE_OPTIONS: "--max-old-space-size=3072"

  governance-service:
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 1G
          cpus: "1.0"
    environment:
      NODE_ENV: production

  library-service:
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 1G
          cpus: "1.0"
    environment:
      NODE_ENV: production

  conversion-service:
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 2G
          cpus: "2.0"
    environment:
      NODE_ENV: production

  replication-service:
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 4G
          cpus: "2.0"
    environment:
      NODE_ENV: production

  rendering-environment:
    deploy:
      replicas: 3
      resources:
        limits:
          memory: 6G
          cpus: "3.0"
    environment:
      NODE_ENV: production

  frontend:
    deploy:
      replicas: 3
      resources:
        limits:
          memory: 1G
          cpus: "1.0"
    environment:
      NODE_ENV: production
