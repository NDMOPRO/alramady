      - NODE_ENV=development
      - LOG_LEVEL=debug
    ports:
      - "8009:8009"
      - "9229:9229"
    command: sh -c "cd /app/packages/shared/services && npx -y tsc --target es2022 --module commonjs --esModuleInterop --skipLibCheck --downlevelIteration --declaration --outDir . cross-engine-bridge.ts 2>/dev/null; cd /app && npx tsx watch --inspect=0.0.0.0:9229 src/index.ts"

